name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev gettext libltdl-dev libzip-dev

      - name: Instalar Buildozer e Cython
        run: |
          pip install buildozer cython

      - name: Aceitar licenças do Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Construir o APK com Buildozer
        run: buildozer android debug

      - name: Fazer upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-android
          path: bin/*.apk
