name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential ccache git python3-dev \
            libffi-dev libssl-dev libltdl-dev libzip-dev \
            unzip wget curl autoconf libtool pkg-config \
            zlib1g:i386 libstdc++6:i386

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Configurar Android SDK e compatibilidade tools/bin
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-33" "ndk;25.2.9519653"
          sudo ln -s /usr/local/lib/android/sdk/cmdline-tools/latest /usr/local/lib/android/sdk/tools
          mkdir -p /home/runner/.buildozer/android/platform
          ln -s /usr/local/lib/android/sdk /home/runner/.buildozer/android/platform/android-sdk

      - name: Compilar APK com Buildozer
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        run: |
          buildozer -v android debug

      - name: Guardar artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-android
          path: bin/*.apk
